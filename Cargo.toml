[package]
name = "katamari"
version = "0.11.1"
edition = "2024"
description = "Terminal diff-review tool with LSP — hover, go-to-definition, references and diagnostics inside a git/jj diff"
license = "MIT"
repository = "https://github.com/isamisushi/katamari"
homepage = "https://github.com/isamisushi/katamari"

[[bin]]
name = "katamari"
path = "src/main.rs"

[[bin]]
name = "ktmr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# `ktmr self-update`'s only dependency: axodotdev's own updater library, the
# same one cargo-dist's generated `<app>-update` binary uses to read the
# install receipt the shell installer writes and re-run it at the latest
# tag. `default-features = false` drops nothing we'd otherwise get for
# free here (0.10.2's only non-default feature is `blocking`) — this is
# deliberate about the two features we do want: `blocking` for a sync
# call (see `run_self_update`'s doc comment on why that's still
# no-tokio-in-the-TUI-safe) instead of hand-rolling a runtime, and
# `github_releases` (on by default upstream) since GitHub is the only
# release host this crate ships to.
axoupdater = { version = "0.10.2", default-features = false, features = ["blocking", "github_releases"] }
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
lsp-types = "0.97.0"
notify = "8.2.0"
ratatui = "0.30.2"
# Only for `set_client` on the `AxoUpdater` above: axoupdater's own default
# client has no request timeout (see `update::SELF_UPDATE_NETWORK_TIMEOUT`'s
# doc comment), and the only way to change that is to build one ourselves
# and hand it in. `default-features = false` adds nothing new to the build —
# axoasset (an axoupdater dependency) already requests this same crate at
# this same version with "json"/"default-tls", which Cargo's feature
# unification applies regardless of what this line asks for; declaring
# fewer features here just keeps this crate's own request minimal and
# honest about what it actually uses (`Client::builder().timeout(..)`).
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.11"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
toml = "0.9.7"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "2"
flate2 = "1.1.9"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Already in the tree transitively (via zip/ureq — see Cargo.lock), so this
# adds no new download: used only by tests/support/harness.rs to decode the
# OSC 52 clipboard payloads it captures. Production's own `write_osc52`
# still hand-rolls its encoder rather than pull this in (see
# `src/ui/clipboard.rs`'s docs on why) — that reasoning is about not adding
# a new dependency to the shipped binary, which a dev-only, test-only
# decoder never touches.
base64 = "0.22"
tempfile = "3.27.0"
pty-process = "0.5"
vt100 = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
