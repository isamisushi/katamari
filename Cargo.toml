[package]
name = "katamari"
version = "0.4.0"
edition = "2024"
description = "Terminal diff-review tool with LSP — hover, go-to-definition, references and diagnostics inside a git/jj diff"
license = "MIT"
repository = "https://github.com/isamisushi/katamari"
homepage = "https://github.com/isamisushi/katamari"

[[bin]]
name = "katamari"
path = "src/main.rs"

[[bin]]
name = "ktmr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.33"
lsp-types = "0.97.0"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.26.11"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.11"
tree-sitter-java = "0.23.5"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
toml = "0.9.7"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "2"
flate2 = "1.1.9"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
pty-process = "0.5"
vt100 = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
