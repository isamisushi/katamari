[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew", "shell"]
# A GitHub repo to push Homebrew formulas to
tap = "isamisushi/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# The musl pair exists for Alpine and for glibc older than the 2.34 the
# gnu binaries need (RHEL 8, Ubuntu 20.04, ...) — fully static, runs on
# any Linux; the shell installer falls back to it automatically.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

# musl-gcc for the musl targets' C dependencies (tree-sitter grammars);
# harmless no-op on the gnu builds.
[dist.dependencies.apt]
musl-tools = "*"
